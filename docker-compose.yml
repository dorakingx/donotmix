# One command:  docker compose up --build
#   Flagsmith (self-hosted) -> http://localhost:8000
#   DoNotMix dashboard      -> http://localhost:8765
# Local demo only: secrets are throwaway defaults; Flagsmith credentials are generated on first run
# and stored in the donotmix-state volume.
name: donotmix

x-flagsmith-env: &flagsmith-env
  DATABASE_URL: postgresql://postgres:password@postgres:5432/flagsmith
  USE_POSTGRES_FOR_ANALYTICS: 'true'
  ENVIRONMENT: production
  DJANGO_ALLOWED_HOSTS: '*'
  FLAGSMITH_DOMAIN: localhost:8000
  DJANGO_SECRET_KEY: donotmix-local-dev-only
  TASK_RUN_METHOD: SYNCHRONOUSLY

services:
  postgres:
    image: postgres:15.5-alpine
    environment: {POSTGRES_PASSWORD: password, POSTGRES_DB: flagsmith}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ['CMD-SHELL', 'pg_isready -d flagsmith -U postgres'], interval: 2s, timeout: 2s, retries: 30}

  migrate-db:
    image: docker.flagsmith.com/flagsmith/flagsmith:${FLAGSMITH_IMAGE_TAG:-latest}
    command: [migrate]
    environment: *flagsmith-env
    depends_on: {postgres: {condition: service_healthy}}

  flagsmith:
    image: docker.flagsmith.com/flagsmith/flagsmith:${FLAGSMITH_IMAGE_TAG:-latest}
    command: [serve]
    environment: *flagsmith-env
    ports: ["${FLAGSMITH_PORT:-8000}:8000"]
    depends_on: {migrate-db: {condition: service_completed_successfully}}

  donotmix:
    build: .
    environment:
      FLAGSMITH_API_URL: http://flagsmith:8000
      DONOTMIX_ENV_FILE: /state/flagsmith.env
    volumes: [donotmix-state:/state]
    ports: ["${DONOTMIX_PORT:-8765}:8765"]
    depends_on: {flagsmith: {condition: service_started}}

volumes:
  pgdata:
  donotmix-state:
